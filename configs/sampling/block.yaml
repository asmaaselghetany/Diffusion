# BlockTrainer sampling defaults — SHARED ANCESTRAL CORE for all pipelines
# (conversion|native × masked|uniform). Paper overlays are eval/train pins only:
#   Fast-dLLM exactness → unmask_threshold + greedy + DualCache/single_stream
#   BlockGen exactness  → use_arpc + arpc_mode=blockgen
# Default below = DECODE_PROFILE=baseline (no confidence, no ARPC, no DualCache).
predictor: ddpm_cache
steps: 32
inject_bos: True
use_float64: False
p_nucleus: 1.0
num_sample_batches: 1
num_sample_log: 2
# --- ARPC (uniform + size-1 mixture; default off) ---
use_arpc: False
# simplified = prefix fill + confidence resample (legacy B3)
# blockgen = in-loop predictor–corrector with corruption modes
arpc_mode: simplified
arpc_prefix_frac: 0.25
arpc_resample_tau: 0.5
arpc_corruption_mode: divergence   # random|divergence|diffusion_metric|ar_metric
arpc_divergence_measure: kld       # kld|reverse_kld|tvd
arpc_diffusion_metric: confidence  # entropy|confidence|margin
arpc_ar_metric: nll                # nll|gap_to_top1|entropy
arpc_warmup_steps: 0
arpc_guide_every: 1
# Softmax temperature for ARPC proposal / resample (1.0 = unchanged).
arpc_temperature: 1.0
# null → true for simplified, false for blockgen (set explicitly to override)
arpc_use_prefix_fill: null
# null = follow algo.shift_loss_targets; true/false forces A/B.
align_shift_logits: null
# Fast-dLLM small_block_size analogue (decode windowing).
# Must divide block_size when set (e.g. 8 with block_size 32).
sub_block_size: null
# Greedy argmax decode (Fast-dLLM eval default); set false for stochastic.
greedy: False
# Fast-dLLM confidence commit (null = ancestral random denoise step).
unmask_threshold: null
# Progressive truncated decode (prefix+active only) + causal KV for ARPC.
hierarchical_kv: False
# Fast-dLLM DualCache replace_position splice (requires hierarchical_kv).
use_block_cache: False
# Hub generate: single-stream block-causal (not dual-stream train concat).
single_stream_decode: False
# Hub AR block-bridge after each fully unmasked attention block
# (generation_functions.py ~81-85). null = auto ON for masked+shift, OFF else.
# Set false to disable; true forces on for masked even without shift.
ar_block_bridge: null
# Ban MASK/PAD logits during denoise (default on). Hub does not ban — set
# false for closer bit-parity probes.
ban_mask_pad_logits: True
# Pad tokens after first EOS (stops post-EOS soup in token space).
pad_after_eos: True
# Stop scheduling later blocks once all rows emitted EOS.
stop_on_eos: True
# Family-aware free sample mode for train SampleSaver / base.generate_samples.
# auto → conversion_free (Nemotron/ar2block) vs native_free (OWT/block).
sample_mode: auto
# Cap generated tokens during train callbacks (null = full seq / sampler default).
max_new_tokens: 512
sampler:
  _target_: discrete_diffusion.sampling.block_sampler.BlockSampler
