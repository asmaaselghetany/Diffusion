# Instruction SFT data for Qwen block diffusion (masked + uniform arms).
# Default: Llama-Nemotron post-training SFT (Fast-dLLM-style).
# Rollback to Alpaca: override /data: sft_qwen_alpaca
#
# Enhanced conversion baseline (NOT a Fast-dLLM lever):
#   defaults = chat,safety,science,math,code
#   math≤1M, code≤500k (v3-richmath; was 100k)
# Override:
#   NEMOTRON_SFT_SPLITS=chat,safety,science
#   NEMOTRON_SFT_MAX_PER_SPLIT=code=500000,math=1000000
# ChatML + Hub-like vocab keep + shared cache fingerprint live in
#   discrete_diffusion.data.conversion_baseline
train: nemotron-sft-train
valid: nemotron-sft-valid
tokenizer_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
cache_dir: ${scratch_dir}/block_qwen_sft_nemotron
wrap: True
chunking: none
streaming: False
insert_train_eos: True
insert_valid_eos: True
insert_train_special: True
insert_valid_special: True
min_length: 0
train_min_length: 0
valid_min_length: 0
