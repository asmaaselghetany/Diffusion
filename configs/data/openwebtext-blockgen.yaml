# BlockGen OWT recipe data on our Qwen stack.
# HF source + train/valid split match third_party/blockgen/dataloader.py
# (jdeschena/openwebtext, train[:-100k] / train[-100k:]).
# Tokenizer is Qwen (our backbone); BlockGen uses GPT-2 — documented delta.
train: openwebtext-blockgen-train
valid: openwebtext-blockgen-valid
tokenizer_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
cache_dir: ${scratch_dir}/openwebtext-blockgen-qwen
wrap: True
streaming: False
insert_train_eos: True
insert_valid_eos: True
insert_train_special: True
insert_valid_special: True
chunking: none
min_length: 0
train_min_length: 0
valid_min_length: 0
