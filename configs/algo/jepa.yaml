defaults:
  - /forward_process: absorbing

_target_: discrete_diffusion.algorithms.jepa.LatentJEPATrainer
name: jepa
backbone: latent_jepa

# Required base params
parameterization: subs
T: 0  # Not used for JEPA but required by base
time_conditioning: true

# Training stage: 1 = full JEPA, 2 = decoder only
stage: 1

# JEPA objective params
sampling_eps: 1e-3
lambda_var: 0.1
lambda_cov: 0.04
redundancy: vicreg  # vicreg, barlow, none
loss_norm: l2  # l2, cosine
mask_only: true
normalize_targets: true
vicreg_eps: 0.001  # bf16 stability (increased from 1e-4)

# # Noise warmup (optional curriculum)
# noise_warmup_start_step: 0
# noise_warmup_end_step: 0
# noise_warmup_range: [0.15, 0.3]

# Stage 2 specific
latent_source: teacher  # predicted, teacher, mixed
mixed_schedule: linear  # linear, constant
mixed_warmup_steps: 10000
weight_by_hazard: true

# Stage 2 mixing study parameters (teacher latent scaffold with rapid handover)
teacher_mix_warm_frac: 0.07        # s_w = 7% of Stage-2 steps for warm window
teacher_mix_type: bernoulli        # 'bernoulli' (bimodal sampling) or 'blend' (linear interp)
teacher_corruption_lambda: 0.7     # lambda for noise corruption on teacher latents
teacher_error_ema_decay: 0.99      # EMA decay for per-dimension error sigma estimation

# Robust teacher corruption parameters (Stage 2)
noise_warmup_steps: 5000           # Steps to ramp up noise from 0 to full
noise_min_samples: 1000.0          # Min effective samples before applying noise
noise_max_ratio: 2.0               # Max noise magnitude relative to z_0 std
noise_time_scaling: true           # Scale noise by sqrt(t)

# Noise schedule
noise_schedule:
  name: log_linear
  eps: ${noise.eps}

# Sampler for generation
sampler:
  _target_: discrete_diffusion.sampling.latent_jepa.LatentJEPASampler

