# Quick preset for local/iterative capability checks.
num_samples: 32
num_steps: 32

eval_model: gpt2
ppl_batch_size: 4
ppl_max_length: 512

reconstruction_batch_size: 8
generation_batch_size: 4

eta: 1.0
temperature: 1.0
top_p: 0.95
top_k: 0
ban_special_tokens: true
sampling_eps: 1.0e-5

infill_span_fraction: 0.25
infill_min_span_tokens: 4
qa_max_answer_tokens: 32

clip_denoised: false
clip_range: [-10.0, 10.0]

sample_save_limit: 32
