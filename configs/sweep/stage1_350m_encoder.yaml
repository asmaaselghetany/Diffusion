# Stage 1 Encoder Hyperparameter Sweep - 350M Model
# Following hyperparameter_tuning_plan.md Section 4.1
# Two baseline configurations (A: wide, B: deep)

sweep:
  name: stage1_350m_encoder
  method: latin_hypercube
  metric:
    name: latent/cosine_similarity
    goal: maximize
  
  early_terminate:
    type: collapse_detection
    min_steps: 10000
    std_threshold: 0.1
    loss_threshold: 10.0
  
  parameters:
    # ---- Encoder Architecture ----
    model.latent_dim:
      values: [512, 768, 1024]
      baseline: 768
    
    model.hidden_size:
      values: [512, 768, 1024]
      baseline: 768
    
    model.n_heads:
      values: [8, 12, 16]
      baseline: 12
    
    model.n_blocks:
      values: [20, 24, 28, 32]
      baseline: 24
    
    model.dropout:
      values: [0.0]
      baseline: 0.0
    
    model.time_embed_dim:
      values: [128, 256]
      baseline: 128

fixed:
  algo: jepa
  algo.stage: 1
  model: latent_jepa_350
  model.gradient_checkpointing: true  # Enable to reduce memory usage (~2-4x reduction)
  model.predictor_depth: 12
  model.predictor_hidden_size: 384
  model.predictor_n_heads: 6
  model.readout_type: transformer
  model.readout_hidden_size: 768
  model.readout_depth: 4
  model.ema_decay: 0.996
  model.ema_warmup_steps: 200000
  model.ema_final_decay: 0.9999
  data: openwebtext-split
  data.cache_dir: /home/hk-project-p0023960/hgf_nhz3359/New_Discrete_Diffusion-main/datasets/pgm_owt
  trainer.max_steps: 200000
  trainer.val_check_interval: 5000
  loader.global_batch_size: 256
  optim.lr: 3e-4

constraints:
  - type: divisible
    params: [model.hidden_size, model.n_heads]

