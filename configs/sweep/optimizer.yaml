# Optimizer and Learning Rate Schedule Sweep
# Following hyperparameter_tuning_plan.md Section 7

sweep:
  name: optimizer_sweep
  method: latin_hypercube
  metric:
    name: latent/cosine_similarity
    goal: maximize
  
  early_terminate:
    type: collapse_detection
    min_steps: 5000
    std_threshold: 0.1
    loss_threshold: 10.0
  
  parameters:
    # ---- Optimizer ----
    optim.lr:
      values: [1e-4, 3e-4, 1e-3]
      baseline: 3e-4
    
    optim.weight_decay:
      values: [0.0, 0.01, 0.1]
      baseline: 0.0
    
    optim.beta1:
      values: [0.9, 0.95]
      baseline: 0.9
    
    optim.beta2:
      values: [0.98, 0.999]
      baseline: 0.999
    
    # ---- Learning Rate Schedule ----
    lr_scheduler.warmup_steps:
      values: [1000, 2000, 5000, 10000]
      baseline: 2000
    
    lr_scheduler.start_factor:
      values: [1e-3, 1e-2, 0.1]
      baseline: 1e-3

fixed:
  algo: jepa
  algo.stage: 1
  model: latent_jepa_180M
  model.gradient_checkpointing: true  # Enable to reduce memory usage (~2-4x reduction)
  data: openwebtext-split
  data.cache_dir: /home/hk-project-p0023960/hgf_nhz3359/New_Discrete_Diffusion-main/datasets/pgm_owt
  trainer.max_steps: 200000
  trainer.val_check_interval: 5000
  loader.global_batch_size: 256
  lr_scheduler: cosine_decay_warmup

