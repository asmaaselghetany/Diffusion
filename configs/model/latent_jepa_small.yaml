

# Hydra config for Small LatentJEPA model (~30M params)
_target_: discrete_diffusion.models.latent_jepa.LatentJEPA

name: latent_jepa_small
type: latent_jepa

# Memory optimization
gradient_checkpointing: true # Enable to trade compute for memory (~2-4x reduction, ~20% slower)

# Encoder: tokens → latents (smaller)
latent_dim: 256
hidden_size: 384
n_heads: 6
n_blocks: 6
dropout: 0.1

# Time conditioning
time_conditioning: true
time_embed_dim: 128

# Predictor: noisy → clean latents (smaller)
predictor_type: transformer
predictor_depth: 4
predictor_hidden_size: 256
predictor_n_heads: 4
predictor_use_projections: true

# Readout decoder: latents → token logits (smaller)
readout_type: tiny_transformer
readout_hidden_size: 384
readout_depth: 4
tie_readout_to_embedding: false

# EMA teacher
ema_decay: 0.996
ema_warmup_steps: 50000
ema_final_decay: 0.9999
copy_on_init: true

# Sequence params (injected by train.py)
length: 1024
max_tokens: 1024

