# Latent JEPA 180M config (matches Diffusion-Jepa original)
# Encoder: Tokens → Latents
# Predictor: Noisy latents → Clean latents
# Readout: Latents → Token logits
_target_: discrete_diffusion.models.latent_jepa.LatentJEPA

name: latent_jepa_180M
type: latent_jepa

# Memory optimization
gradient_checkpointing: true # Enable to trade compute for memory (~2-4x reduction, ~20% slower)

# Architecture dimensions (encoder/predictor)
latent_dim: 768          # Latent representation dim
hidden_size: 384         # Transformer hidden size
n_heads: 4               # Attention heads
n_blocks: 8             # Encoder transformer blocks
dropout: 0.1             # Dropout probability

# Time conditioning (optional)
time_conditioning: true  # Enable time conditioning
time_embed_dim: 128      # Time embedding dim (if enabled)

# Predictor configuration (noisy latents → clean latents)
predictor_type: transformer        # "mlp" | "transformer"
predictor_depth: 6                # Predictor depth
predictor_hidden_size: 384        # Predictor hidden size
predictor_n_heads: 6              # Predictor heads
predictor_use_projections: true   # Project when dims don't match

# Readout decoder (latents → token logits; shallow for eval/sampling)
readout_type: tiny_transformer     # "tied_linear" | "mlp" | "tiny_transformer"
readout_hidden_size: 512           # Readout hidden size
readout_depth: 2                  # Readout depth
tie_readout_to_embedding: false    # Tie weights (only for tied_linear)

# EMA teacher (cosine momentum schedule)
ema_decay: 0.996          # Base EMA decay (start)
ema_warmup_steps: 200000  # Cosine schedule steps (0 = constant)
ema_final_decay: 0.9999   # Final EMA decay (end)
copy_on_init: true        # Init teacher from student

# vocab_size is injected by train.py
# Sequence params (injected by train.py)
length: 1024
max_tokens: 1024
