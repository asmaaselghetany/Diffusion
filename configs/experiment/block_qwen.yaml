# @package _global_
# Qwen2.5-1.5B-Instruct block diffusion SFT (masked | uniform arms).
# Pass algo=block_masked | block_uniform at launch.
#
# Neutral baseline: masked vs uniform differ only via algo= at launch (corruption
# type). All optional arm-specific training hooks stay off in algo configs.
#
# Hyperparams match Fast-dLLM 1.5B (seq 2048, block 32, lr 2e-5, warmup 500,
# global batch 256, 6000 steps ≈ 3.15B tokens via grad accum). Paper-specific
# hooks (shift, complementary masks, block-size mixture, ARPC) are documented in
# docs/BLOCK_QWEN_TRAINING.md — enable via HYDRA_OVERRIDES, not this file.
#
# Data: Llama-Nemotron post-training SFT (chat+safety+science by default).
# Rollback: override /data: sft_qwen_alpaca
defaults:
  - override /data: sft_qwen
  - override /model: qwen_block
  - override /noise: log-linear
  # Do NOT override /sampling here — algo pins
  # override /sampling@_global_.sampling (uniform → block_uniform = hierarchical_ss).
  # Launch also passes sampling=<arm> as belt-and-suspenders.
  - override /strategy: single-device
  - override /lr_scheduler: block_warmup
  - override /callbacks:
    - checkpoint_every_n_steps
    - checkpoint_monitor
    - learning_rate_monitor
    - seed_checkpoint_resume_step
    - save_last_on_train_end
    - prune_periodic_checkpoints

block_size: 32

model:
  length: 2048
  hub_id: Qwen/Qwen2.5-1.5B-Instruct
  attn_implementation: sdpa
  gradient_checkpointing: true

data.tokenizer_name_or_path: Qwen/Qwen2.5-1.5B-Instruct

optim:
  lr: 2.0e-5
  weight_decay: 0
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

trainer:
  max_steps: 6000
  devices: 1
  accelerator: cuda
  precision: bf16
  num_sanity_val_steps: 0
  # Cheap in-train monitor (~64 batches ≈ a few seconds). Full val/gen-PPL
  # is post-train via eval_checkpoint.sbatch.
  limit_val_batches: 64
  # Lightning counts *batches*, not optimizer steps. With accumulate_grad_batches
  # ≈ 128 (global 256 / 2 GPUs) or 256 (1 GPU), bare 500 was too frequent.
  # Multiply so we validate every 500 optimizer steps.
  val_check_interval: ${mul:500, ${trainer.accumulate_grad_batches}}
  log_every_n_steps: 50

loader:
  batch_size: 1
  global_batch_size: 256
  eval_global_batch_size: 1  # symmetric for masked/uniform fair compare (uniform OOMs at 8)
  # 4 workers × 32 ranks can exhaust node /dev/shm (bus error mid-val). Prefer
  # 2 + file_system sharing (see loaders._ensure_file_system_tensor_sharing).
  num_workers: 2
  pin_memory: true

eval:
  # Upstream default is generate_samples=true. Off here for Qwen-1.5B / seq-2048
  # throughput (paper-like train loop). Re-enable like other UNI-D² examples:
  #   eval.generate_samples=true sampling.num_sample_batches=1
  # Post-train free-gen/gen-PPL: examples/block_qwen/eval.sh (upstream modules).
  generate_samples: false
  save_validation_samples: false
  compute_perplexity_on_sanity: false
  # Layer-3 diagnostic: log val NLL/BPD/PPL by α band. Off in yaml; example
  # scripts turn it on via CLI.
  t_bucketed_nll: false
  collapse_early_stop: false
  collapse_min_step: 500
  collapse_patience: 2
  collapse_uniq_ratio_max: 0.05
  collapse_top_frac_min: 0.5
  collapse_min_fraction: 0.5


wandb:
  project: block_qwen
  entity: aselghetany-nu
  name: null
  id: null
  # Reuse run id across Slurm resumes so charts continue on one WandB page.
  resume: allow

callbacks:
  # Periodics (0-N.ckpt) are the resume safety net if last.ckpt truncates.
  # Lightning requires save_top_k=-1 when monitor=None; prune_periodic_checkpoints
  # keeps newest 2 (+ last + best from other callbacks).
  # every_n must divide max_steps (6000) or the final step never triggers a
  # periodic save; SaveLastOnTrainEnd covers the remainder as a backstop.
  checkpoint_every_n_steps:
    every_n_train_steps: 500
    save_top_k: -1
    save_last: true
  checkpoint_monitor:
    monitor: val/bpd
    save_top_k: 1
  prune_periodic_checkpoints:
    keep_newest: 2

checkpointing:
  resume_from_ckpt: true
