# @package _global_
# Cluster-ready smoke / short-run defaults for Qwen block diffusion.
defaults:
  - override /data: synthetic
  - override /model: qwen_block
  - override /algo: block_masked
  - override /strategy: single-device

block_size: 16
model.length: 128

trainer:
  max_steps: 1000
  devices: 1
  accelerator: cuda
  precision: bf16
  num_sanity_val_steps: 0
  limit_val_batches: 1.0

loader:
  batch_size: 4
  global_batch_size: 4
  eval_global_batch_size: 4
  num_workers: 4
  pin_memory: true

eval:
  generate_samples: false

wandb: null
callbacks: {}
checkpointing:
  resume_from_ckpt: false
