# @package _global_
# Matched AR SFT baseline (C3): same Nemotron / steps / LR / batch as block_qwen.
# Uses Qwen causal forward (no block concat / corruption).
defaults:
  - override /data: sft_qwen
  - override /model: qwen_block
  - override /algo: ar_sft
  - override /noise: log-linear
  - override /sampling: default
  - override /strategy: single-device
  - override /lr_scheduler: block_warmup
  - override /callbacks:
    - checkpoint_every_n_steps
    - checkpoint_monitor
    - learning_rate_monitor
    - seed_checkpoint_resume_step
    - save_last_on_train_end

block_size: 32  # unused by AR; kept for config symmetry

model:
  length: 2048
  hub_id: Qwen/Qwen2.5-1.5B-Instruct
  attn_implementation: sdpa
  gradient_checkpointing: true
  load_pretrained: true
  forward_mode: causal

data.tokenizer_name_or_path: Qwen/Qwen2.5-1.5B-Instruct

optim:
  lr: 2.0e-5
  weight_decay: 0
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

trainer:
  max_steps: 6000
  devices: 1
  accelerator: cuda
  precision: bf16
  num_sanity_val_steps: 0
  limit_val_batches: 64
  val_check_interval: ${mul:500, ${trainer.accumulate_grad_batches}}
  log_every_n_steps: 50

loader:
  batch_size: 1
  global_batch_size: 256
  eval_global_batch_size: 2
  num_workers: 4
  pin_memory: true

eval:
  generate_samples: false
  save_validation_samples: false
  compute_perplexity_on_sanity: false
  t_bucketed_nll: false

wandb:
  project: block_qwen
  entity: aselghetany-nu
  name: null
  id: null
  resume: allow

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 500
    save_top_k: -1
    save_last: true
  checkpoint_monitor:
    monitor: val/bpd
    save_top_k: 1

checkpointing:
  resume_from_ckpt: true
