# Paper design cells — single source of truth for launch wiring.
# Consumed by scripts/submit_paper_cell.sh
#
# status:
#   ready     — submit now (paper scale)
#   eval_only — needs an existing checkpoint
#   stub      — not implemented; refuse with message
#   running   — informational only (update manually / ignore)

version: 1

defaults:
  scale: paper   # 6000 / 2048 / 256 for train cells
  wandb_project: block_qwen
  num_gpus: 2

cells:
  # ---- Main track (conversion) ----
  C0:
    title: "Neutral AR→block masked (hooks off)"
    status: ready
    kind: train
    axis: [A, D_neutral, C_masked]
    launch: ar2block_masked
    notes: "Reference conversion skeleton. Prefer existing ar2block_masked_141728 if already done."

  C2_shift:
    title: "Axis D — shift only"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_shift
    arm: masked
    notes: "Strict Tab-2 single factor."

  C2_comp:
    title: "Axis D — complementary only"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_comp
    arm: masked
    notes: "Paired m/~m (sequential forwards)."

  C2_fdllm:
    title: "Axis D — shift + complementary (strict)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_fdllm
    arm: masked
    notes: "Paper Tab-2 combined control. Job 145506 queued; do not resubmit blindly."

  C2_fdllm_full:
    title: "Axis D — Fast-dLLM-ish (+ mask_schedule)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_fdllm_full
    arm: masked
    notes: "Label separately from C2_fdllm in tables."

  C3:
    title: "Matched AR SFT baseline"
    status: ready
    kind: train
    axis: [A]
    launch: ar_sft
    notes: "Resume ar_sft_143599 / job 145451 if incomplete; else fresh ar_sft.sbatch."

  C4:
    title: "Decode NFE sweep on a conversion ckpt"
    status: eval_only
    kind: eval_nfe
    axis: [E]
    launch: nfe_sweep
    notes: "Requires CKPT=... NUM_STEPS_LIST='8 16 32 64'"

  C5_joint_ar:
    title: "Joint AR + diffusion (block-clean stream, α=0.3)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C5_joint_ar
    arm: masked
    notes: >
      L = L_AR + 0.3 L_diff on dual-stream clean half (not causal NLD).
      Use val/joint_nll for objective; val/nll stays diffusion-only.

  C5_causal_clean:
    title: "Joint AR + diffusion (token-causal clean stream)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C5_causal_clean
    arm: masked
    notes: "NLD-like causal AR pass; same α. Prefer this over C5_joint_ar for causal claims."

  # ---- Bonus ----
  B1_masked:
    title: "Corruption slice — AR→block masked (= C0)"
    status: ready
    kind: train
    axis: [C]
    launch: ar2block_masked
    notes: "Same recipe as C0; use C0 run for the masked row."

  B1_uniform:
    title: "Corruption slice — AR→block uniform"
    status: ready
    kind: train
    axis: [C]
    launch: ar2block_uniform
    notes: "Hold A/B/D/E fixed vs C0."

  B2_masked:
    title: "Scratch init — block masked"
    status: ready
    kind: train
    axis: [A]
    launch: block_masked
    notes: "LINE=block (load_pretrained=false)."

  B2_uniform:
    title: "Scratch init — block uniform"
    status: ready
    kind: train
    axis: [A]
    launch: block_uniform

  B3_mixture:
    title: "BlockGen mixture [16,32]"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_mixture
    arm: masked
    notes: "Single-factor geometry. Launchable; interpret vs C0/C2 when reporting."

  B3_t_strat:
    title: "Timestep stratified_gamma=0.5"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_t_strat
    arm: masked
    notes: "t-strat within fixed block size (≠ BlockGen u-stratified)."

  B3_weights_32:
    title: "BlockGen weighted mixture ending at size 32"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_weights_32
    arm: masked
    notes: "bg_weights_1_32 + same per-GPU size."

  B3_u_stratified:
    title: "BlockGen u-stratified block-size draw"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_u_stratified
    arm: masked
    notes: "Requires bg_weights; implemented in block_geometry."

  B3_arpc:
    title: "BlockGen mixture[1,32] + full ARPC"
    status: ready
    kind: train
    axis: [B, E]
    launch: lever
    preset: B3_arpc
    arm: uniform
    notes: "Uniform-only; arpc_mode=blockgen (divergence)."

  B4_hybrid_p10:
    title: "Hybrid noising (mask + 10% uniform)"
    status: ready
    kind: train
    axis: [C]
    launch: lever
    preset: B4_hybrid_p10
    arm: hybrid
    notes: >
      B4v1 locked: surrogate ELBO + decode-as-masked at default p=0.1.
      See DESIGN_LOCKS.md.

  B4_hybrid_p50:
    title: "Hybrid noising (mask + 50% uniform)"
    status: ready
    kind: train
    axis: [C]
    launch: lever
    preset: B4_hybrid_p50
    arm: hybrid
    notes: "Real p sweep vs B4_hybrid_p10 default pin."

  E_sub_block:
    title: "Decode — sub_block_size=8 only"
    status: eval_only
    kind: eval_decode
    axis: [E]
    launch: decode_eval
    preset: decode_sub_block
    arm: masked
    notes: "Requires CKPT= conversion checkpoint. Eval-time sampling only."

  E_hierarchical:
    title: "Decode — progressive truncate (no DualCache)"
    status: eval_only
    kind: eval_decode
    axis: [E]
    launch: decode_eval
    preset: decode_hierarchical
    arm: masked
    notes: "CKPT= on C0/C2 ckpt. Quality-preferred progressive decode."

  E_dual_cache:
    title: "Decode — DualCache replace_position (tok/s)"
    status: eval_only
    kind: eval_decode
    axis: [E]
    launch: decode_eval
    preset: decode_dual_cache
    arm: masked
    notes: "CKPT= on conversion ckpt. Tok/s probes only."

  longitudinal:
    title: "Longitudinal milestone eval (§7)"
    status: eval_only
    kind: eval_longitudinal
    axis: [E]
    launch: longitudinal_eval
    notes: "RUN_ROOT=... STEPS optional. Writes eval/step_<N>/ bundles."

  # ---- Eval helpers ----
  eval_ckpt:
    title: "Full eval suite for one checkpoint"
    status: eval_only
    kind: eval
    launch: eval_checkpoint
    notes: "CKPT=path/to.ckpt"

  lm_eval:
    title: "lm-eval + tok/s for one checkpoint"
    status: eval_only
    kind: eval
    launch: lm_eval
    notes: "CKPT=path/to.ckpt TASKS=gsm8k,ifeval"
