# Paper design cells — single source of truth for launch wiring.
# Consumed by scripts/submit_paper_cell.sh
#
# status:
#   ready     — submit now (paper scale)
#   eval_only — needs an existing checkpoint
#   stub      — not implemented; refuse with message
#   running   — informational only (update manually / ignore)

version: 1

defaults:
  scale: paper   # 6000 / 2048 / 256 for train cells
  wandb_project: block_qwen
  num_gpus: 2

cells:
  # ---- Main track (conversion) ----
  C0:
    title: "Neutral AR→block masked (hooks off)"
    status: ready
    kind: train
    axis: [A, D_neutral, C_masked]
    launch: ar2block_masked
    notes: "Reference conversion skeleton. Prefer existing ar2block_masked_141728 if already done."

  C2_shift:
    title: "Axis D — shift only (C0 + shifted AR logits)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_shift
    arm: masked
    notes: "Strict Tab-2 / Unifusion-compare on masked. Alias preset C0_shift."

  C0_shift:
    title: "C0 + shift (alias of C2_shift)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C0_shift
    arm: masked
    notes: "Same overrides as C2_shift; use for Unifusion x0 naming in tables."

  U0_shift:
    title: "U0 + Unifusion-style shift on uniform"
    status: ready
    kind: train
    axis: [C, D]
    launch: lever
    preset: U0_shift
    arm: uniform
    notes: >
      Direct AR→uniform with shift_loss_targets. Compare to U0 (no shift) and
      to C0_shift/C2_shift (same shift, masked). Math mix. Behind C3/Tab2 unless
      bandwidth allows parallel.

  U0_from_C0:
    title: "Two-stage AR→masked→uniform continue-FT (gated)"
    status: ready
    kind: train
    axis: [C]
    launch: u0_from_c0
    notes: >
      Isolated continue-FT from C0 into a NEW uniform run dir (never writes C0).
      Use scripts/submit_u0_from_c0.sh. Gate: when direct U0 weak vs C0.

  C0_anneal:
    title: "C0 + intra-block causal→bi anneal"
    status: ready
    kind: train
    axis: [E, novelty]
    launch: lever
    preset: C0_anneal
    arm: masked
    notes: "Unifusion anneal port. Isolated — do not confuse with C0."

  U0_anneal:
    title: "U0 + intra-block causal→bi anneal"
    status: ready
    kind: train
    axis: [C, novelty]
    launch: lever
    preset: U0_anneal
    arm: uniform
    notes: "Primary novelty probe. Fresh run dir; default U0 unchanged."

  B4_joint_curriculum:
    title: "Hybrid joint curriculum (attn anneal × kernel p ramp)"
    status: ready
    kind: train
    axis: [C, novelty]
    launch: lever
    preset: B4_joint_curriculum
    arm: hybrid
    notes: "Explorative. Does not replace B4_hybrid_p10 claim row."

  B4_shift_explorative:
    title: "Hybrid + shift_on_hybrid (x0 interface probe)"
    status: ready
    kind: train
    axis: [C, novelty]
    launch: lever
    preset: B4_shift_explorative
    arm: hybrid
    notes: "Opt-in shift on hybrid. Not a main-track B4 row."

  C2_comp:
    title: "Axis D — complementary only"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_comp
    arm: masked
    notes: "Paired m/~m (Hub fused 2B)."

  C2_fdllm:
    title: "Axis D — shift + complementary (strict)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_fdllm
    arm: masked
    notes: "Paper Tab-2 combined control. Job 145506 queued; do not resubmit blindly."

  C2_fdllm_full:
    title: "Axis D — Fast-dLLM-ish (+ mask_schedule)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C2_fdllm_full
    arm: masked
    notes: "Label separately from C2_fdllm in tables."

  C3:
    title: "AR→full-seq diffusion (Unifusion floor) — v2 retry"
    status: eval_pending
    kind: train
    axis: [A]
    launch: lever
    preset: C3_fullseq_v2
    arm: uniform
    notes: >
      Train 2125372 COMPLETED (6k). Eval pending: 2127988 (offline),
      2127989 (GenPPL+H hierarchical), 2127990 (paper_gen lm_eval).
      ARPC skipped (no size-1 mixture). Ckpt:
      outputs/block_qwen/ar2block_uniform_2125372/checkpoints/last.ckpt.
      Forensic: docs/research/C3_UNIFUSION_GAP_2026-09-30.md.

  C3_v1_fail:
    title: "C3 shift-only (failed — do not cite as floor)"
    status: done
    kind: train
    axis: [A]
    launch: lever
    preset: C3_fullseq
    arm: uniform
    notes: >
      Job 2104831: GSM 1.8/4.5; GenPPL~59 soup (FLR=1). Missing anneal+ss.

  A_ar_sft:
    title: "Matched causal AR SFT (Tab-1 AR reference)"
    status: ready
    kind: train
    axis: [A]
    launch: ar_sft
    notes: >
      Causal next-token SFT only — not full-seq diffusion, not C3.
      Floor: ar_sft_1857323 (job 1857323, 6k). GSM 70.8 / IFE 24.6 / MMLU 48.4.
      Fair "stay AR" column vs block (C0) and full-seq diffusion (C3).

  C4:
    title: "Decode NFE + GenPPL–entropy hygiene on a conversion ckpt"
    status: eval_only
    kind: eval_nfe
    axis: [E]
    launch: nfe_sweep
    notes: >
      Unifusion hygiene: NFE ∈ {8,16,32,64} with (PPL, H) pairs; dual GenPPL
      modes (first_chunk vs full); collapse panel. Requires CKPT=...
      Optional: RUN_MULTISEED=1; --with-winogrande on submit_gen_ppl_hygiene.sh.
      Uniform/hybrid: default DECODE_PROFILE=hierarchical_ss; also auto-queued
      from submit_family_eval.sh (SKIP_GENPPL_HYGIENE=1 to disable).

  C5_joint_ar:
    title: "Joint AR + diffusion (block-clean stream, α=0.3)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C5_joint_ar
    arm: masked
    notes: >
      L = L_AR + 0.3 L_diff on dual-stream clean half (not causal NLD).
      Use val/joint_nll for objective; val/nll stays diffusion-only.

  C5_causal_clean:
    title: "Joint AR + diffusion (token-causal clean stream)"
    status: ready
    kind: train
    axis: [D]
    launch: lever
    preset: C5_causal_clean
    arm: masked
    notes: "NLD-like causal AR pass; same α. Prefer this over C5_joint_ar for causal claims."

  # ---- Bonus ----
  B1_masked:
    title: "Corruption slice — AR→block masked (= C0)"
    status: ready
    kind: train
    axis: [C]
    launch: ar2block_masked
    notes: "Same recipe as C0; use C0 run for the masked row."

  B1_uniform:
    title: "Corruption slice — AR→block uniform"
    status: ready
    kind: train
    axis: [C]
    launch: ar2block_uniform
    notes: "Hold A/B/D/E fixed vs C0."

  B2_masked:
    title: "Scratch init — block masked"
    status: ready
    kind: train
    axis: [A]
    launch: block_masked
    notes: "LINE=block (load_pretrained=false)."

  B2_uniform:
    title: "Scratch init — block uniform"
    status: ready
    kind: train
    axis: [A]
    launch: block_uniform

  N0:
    title: "Native block reference — scratch uniform (hooks off)"
    status: ready
    kind: train
    axis: [A]
    launch: lever
    preset: N0
    arm: uniform
    notes: "Native-family floor (line=block). Pair with B2_uniform sbatch for non-lever path."

  B3_mixture:
    title: "Native BlockGen mixture [16,32] (scratch)"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_mixture
    arm: masked
    notes: "line=block only. Compare to N0/B2, not C0. For geometry-on-conversion use xfer_mixture."

  B3_t_strat:
    title: "Timestep stratified_gamma=0.5 (conversion-track)"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_t_strat
    arm: masked
    notes: "Our t-strat on ar2block (≠ BlockGen u-stratified)."

  B3_weights_32:
    title: "Native BlockGen weighted mixture ending at size 32"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_weights_32
    arm: uniform
    notes: "line=block; bg_weights_1_32. Prefer uniform for BlockGen-uniform analogue."

  B3_u_stratified:
    title: "Native BlockGen u-stratified block-size draw"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: B3_u_stratified
    arm: uniform
    notes: "line=block; requires bg_weights. For ar2block transfer use xfer_u_stratified."

  B3_arpc:
    title: "Native BlockGen mixture[1,32] + full ARPC"
    status: ready
    kind: train
    axis: [B, E]
    launch: lever
    preset: B3_arpc
    arm: uniform
    notes: "line=block; uniform-only. Not a conversion cell."

  # ---- Transfer (BlockGen knobs on AR→block; not a BlockGen claim) ----
  xfer_mixture:
    title: "Transfer — mixture [16,32] on ar2block"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: xfer_mixture
    arm: masked
    notes: "Compare to C0, not N0. Never tag as BlockGen recreate."

  xfer_u_stratified:
    title: "Transfer — bg_weights 1+16 + u-strat on ar2block"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: xfer_u_stratified
    arm: uniform
    notes: "Transfer family only."

  xfer_weights_32:
    title: "Transfer — bg_weights 1+32 on ar2block"
    status: ready
    kind: train
    axis: [B]
    launch: lever
    preset: xfer_weights_32
    arm: uniform
    notes: "Transfer family only."

  xfer_arpc:
    title: "Transfer — mixture[1,32] + ARPC on ar2block"
    status: ready
    kind: train
    axis: [B, E]
    launch: lever
    preset: xfer_arpc
    arm: uniform
    notes: "Uniform + ar2block. Different claim from B3_arpc."

  B4_hybrid_p10:
    title: "Hybrid noising (mask + 10% uniform)"
    status: ready
    kind: train
    axis: [C]
    launch: lever
    preset: B4_hybrid_p10
    arm: hybrid
    notes: >
      B4v1 locked: surrogate ELBO + decode-as-masked at default p=0.1.
      See DESIGN_LOCKS.md.

  B4_hybrid_p50:
    title: "Hybrid noising (mask + 50% uniform)"
    status: ready
    kind: train
    axis: [C]
    launch: lever
    preset: B4_hybrid_p50
    arm: hybrid
    notes: "Real p sweep vs B4_hybrid_p10 default pin."

  E_sub_block:
    title: "Decode — sub_block_size=8 only"
    status: eval_only
    kind: eval_decode
    axis: [E]
    launch: decode_eval
    preset: decode_sub_block
    arm: masked
    notes: "Requires CKPT= conversion checkpoint. Eval-time sampling only."

  E_hierarchical:
    title: "Decode — progressive truncate (no DualCache)"
    status: eval_only
    kind: eval_decode
    axis: [E]
    launch: decode_eval
    preset: decode_hierarchical
    arm: masked
    notes: "CKPT= on C0/C2 ckpt. Quality-preferred progressive decode."

  E_dual_cache:
    title: "Decode — DualCache replace_position (tok/s)"
    status: eval_only
    kind: eval_decode
    axis: [E]
    launch: decode_eval
    preset: decode_dual_cache
    arm: masked
    notes: "CKPT= on conversion ckpt. Tok/s probes only."

  longitudinal:
    title: "Longitudinal milestone eval (§7)"
    status: eval_only
    kind: eval_longitudinal
    axis: [E]
    launch: longitudinal_eval
    notes: "RUN_ROOT=... STEPS optional. Writes eval/step_<N>/ bundles."

  # ---- Eval helpers ----
  eval_ckpt:
    title: "Full eval suite for one checkpoint"
    status: eval_only
    kind: eval
    launch: eval_checkpoint
    notes: "CKPT=path/to.ckpt"

  lm_eval:
    title: "lm-eval + tok/s for one checkpoint (family-routed)"
    status: eval_only
    kind: eval
    launch: lm_eval
    notes: >
      CKPT=path/to.ckpt. Routes via submit_family_eval.sh: DualCache exactness
      when ckpt has confidence pins; baseline for C0-style masked; refuses uniform.

  family_eval:
    title: "Auto eval stack (lm-eval DualCache | baseline | ARPC)"
    status: eval_only
    kind: eval
    launch: family_eval
    notes: "CKPT=path/to.ckpt|run_dir — see scripts/submit_family_eval.sh"
